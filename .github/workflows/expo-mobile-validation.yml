name: Expo mobile validation

on:
  push:
    branches:
      - expo-native-foundation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate and commit npm lockfile
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          if [ -n "$(git status --porcelain -- package-lock.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Add reproducible mobile dependency lockfile"
            git push
          fi
      - name: Install exact locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Check Expo package compatibility
        run: npx expo install --check
      - name: Run Expo Doctor
        run: npx expo-doctor@latest
      - name: Export Android JavaScript bundle
        run: npx expo export --platform android --output-dir dist
