name: Build Hotel Easy Pass Package

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create clean sale package
        run: |
          rm -rf package
          mkdir package
          rsync -a --exclude='.git' --exclude='package' --exclude='node_modules' ./ package/
          cd package
          zip -r ../hotel-easy-pass-sale-package.zip . -x '*.DS_Store'
          cd ..

      - name: Upload sale package
        uses: actions/upload-artifact@v4
        with:
          name: hotel-easy-pass-sale-package
          path: hotel-easy-pass-sale-package.zip
          if-no-files-found: error
          retention-days: 90
