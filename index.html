<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f766e">
<meta name="description" content="Hotel Easy Pass - Your simple travel companion">
<title>Hotel Easy Pass</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: "DM Sans", sans-serif;
  background: #f4f8f7;
  color: #173b3a;
  min-height: 100vh;
}

header {
  background: linear-gradient(135deg, #0f766e, #115e59);
  color: white;
  padding: 30px 20px 38px;
  border-radius: 0 0 30px 30px;
  box-shadow: 0 8px 25px rgba(15,118,110,.18);
}

.logo {
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo-icon {
  width: 48px;
  height: 48px;
  background: rgba(255,255,255,.16);
  border: 1px solid rgba(255,255,255,.25);
  border-radius: 15px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 25px;
}

.logo h1 {
  font-family: "Playfair Display", serif;
  font-size: 27px;
}

.logo p {
  font-size: 12px;
  opacity: .85;
  margin-top: 2px;
}

.welcome {
  margin-top: 28px;
}

.welcome h2 {
  font-size: 25px;
  margin-bottom: 7px;
}

.welcome p {
  font-size: 14px;
  opacity: .9;
  line-height: 1.5;
}

.container {
  width: 92%;
  max-width: 700px;
  margin: -18px auto 40px;
  position: relative;
}

.card {
  background: white;
  border-radius: 20px;
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: 0 5px 20px rgba(23,59,58,.07);
  border: 1px solid #e4eeec;
}

.card h3 {
  font-size: 18px;
  margin-bottom: 5px;
}

.card-subtitle {
  font-size: 13px;
  color: #718684;
  margin-bottom: 15px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.feature {
  border: none;
  border-radius: 17px;
  padding: 18px 14px;
  background: #f1f8f7;
  text-align: left;
  cursor: pointer;
  color: #173b3a;
  transition: transform .15s, box-shadow .15s;
}

.feature:active {
  transform: scale(.97);
}

.feature-icon {
  font-size: 25px;
  margin-bottom: 9px;
}

.feature strong {
  display: block;
  font-size: 14px;
  margin-bottom: 3px;
}

.feature span {
  font-size: 11px;
  color: #718684;
}

.quick {
  display: flex;
  align-items: center;
  gap: 14px;
}

.quick-icon {
  width: 46px;
  height: 46px;
  border-radius: 14px;
  background: #e5f4f1;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
}

.quick-text {
  flex: 1;
}

.quick-text strong {
  display: block;
  font-size: 14px;
}

.quick-text span {
  font-size: 12px;
  color: #718684;
}

button.primary {
  width: 100%;
  border: none;
  border-radius: 14px;
  padding: 14px;
  background: #0f766e;
  color: white;
  font-family: inherit;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
}

button.primary:active {
  transform: scale(.98);
}

.points {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.points-number {
  font-size: 28px;
  font-weight: 700;
  color: #0f766e;
}

.points-label {
  font-size: 12px;
  color: #718684;
}

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(10,40,38,.55);
  z-index: 10;
  padding: 25px;
  align-items: flex-end;
  justify-content: center;
}

.modal-box {
  width: 100%;
  max-width: 650px;
  background: white;
  border-radius: 25px 25px 18px 18px;
  padding: 25px;
  max-height: 82vh;
  overflow-y: auto;
}

.modal-box h2 {
  font-family: "Playfair Display", serif;
  margin-bottom: 8px;
}

.modal-box p {
  color: #647875;
  font-size: 14px;
  line-height: 1.6;
  margin-bottom: 18px;
}

.close {
  float: right;
  border: none;
  background: #eef5f3;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  font-size: 18px;
  cursor: pointer;
}

.list-item {
  padding: 14px;
  background: #f4f8f7;
  border-radius: 14px;
  margin-bottom: 10px;
}

.list-item strong {
  display: block;
  margin-bottom: 4px;
}

.list-item span {
  font-size: 12px;
  color: #718684;
}

footer {
  text-align: center;
  color: #91a3a0;
  font-size: 11px;
  padding: 5px 20px 25px;
}

@media (max-width: 400px) {
  .grid {
    gap: 9px;
  }

  .feature {
    padding: 15px 11px;
  }
}
</style>
</head>

<body>

<header>
  <div
