<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#087f78"><meta name="description" content="Hotel Easy Pass helps travelers organize the right trip tools without the clutter.">
<link rel="manifest" href="./manifest.webmanifest"><title>Hotel Easy Pass | Welcome</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 10% 10%,#d9f4ef,transparent 35%),linear-gradient(145deg,#eef8f7,#fff8ef);color:#173b3b;display:grid;place-items:center}.wrap{width:min(720px,100%);padding:24px}.card{background:rgba(255,255,255,.94);border:1px solid #d8ece9;border-radius:30px;padding:34px 26px;box-shadow:0 22px 65px rgba(23,59,59,.14)}.logo{font-size:58px}.badge{display:inline-block;background:#d8f1ed;color:#087f78;padding:7px 11px;border-radius:99px;font-size:10px;font-weight:900;letter-spacing:1px}.card h1{font-size:42px;line-height:1.05;margin:12px 0}.lead{font-size:19px;line-height:1.55;color:#526565}.label{display:block;font-weight:850;margin:24px 0 8px}.input{width:100%;padding:16px;border:1px solid #c9dfdc;border-radius:14px;font:inherit}.note{font-size:13px;line-height:1.5;color:#687979}.btn{width:100%;border:0;border-radius:14px;padding:16px;margin-top:18px;background:#087f78;color:white;font:inherit;font-weight:900;cursor:pointer}.small{font-size:12px;text-align:center;color:#718080;margin-top:18px}@media(max-width:600px){.card h1{font-size:34px}}
</style></head><body><main class="wrap"><section class="card">
<div class="logo">🏨</div><span class="badge">HOTEL EASY PASS</span>
<h1>Welcome! 👋</h1>
<p class="lead">Let's make your trip easier, one simple step at a time.</p>
<label class="label" for="name">What should we call you?</label>
<input id="name" class="input" autocomplete="given-name" placeholder="First name or nickname">
<p class="note">Don't worry. This isn't the name that will be used for your hotel, flight, or other reservations. We'll ask for that information when it's needed.</p>
<button class="btn" onclick="start()">Let's Get Started →</button>
<p class="small">No account required for the core travel tools.</p>
</section></main>
<script>
const saved=JSON.parse(localStorage.getItem("hep_traveler")||"null");
if(saved?.name) location.replace("./traveler.html");
function start(){const name=document.getElementById("name").value.trim();if(!name){document.getElementById("name").focus();return}localStorage.setItem("hep_traveler",JSON.stringify({name,destination:"",tripType:"",travelers:1,days:1,hotel:"need",rental:"undecided",flight:"undecided",needs:[]}));location.href="./traveler.html";}
document.getElementById("name").addEventListener("keydown",e=>{if(e.key==="Enter")start()});
</script></body></html>
