 .hidden{display:none!important}@media(max-width:600px){#hepBillingAuth{grid-template-columns:1fr!important}}</style></head><body><div class="top"><strong>HOTEL EASY PASS · TRAVELER</strong></div><div class="title"><div>🧳 <strong>TRAVELER PASS</strong></div><h1>Your trip, without the clutter.</h1><p>Save your stay, find what you need nearby, manage your trip and get help when plans change.</p></div><section id="hepBilling" style="max-width:820px;margin:14px auto;padding:16px 18px;background:#fff;border:1px solid #d8ece9;border-radius:18px;box-shadow:0 4px 18px rgba(0,0,0,.05)">
