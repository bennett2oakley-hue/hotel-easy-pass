<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Hotel Easy Pass</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap');

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'DM Sans', sans-serif;
  background: #f4f8f7;
  color: #173b3a;
  min-height: 100vh;
}

.header {
  background: linear-gradient(145deg, #0f766e, #155e75);
  color: white;
  padding: 28px 20px 32px;
  border-radius: 0 0 30px 30px;
  box-shadow: 0 8px 25px rgba(15,118,110,.20);
}

.logo {
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo-icon {
  width: 48px;
  height: 48px;
  background: rgba(255,255,255,.16);
  border-radius: 15px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 25px;
}

.logo h1 {
  font-family: 'Playfair Display', serif;
  font-size: 25px;
}

.logo p {
  font-size: 12px;
  opacity: .85;
  margin-top: 2px;
}

.welcome {
  margin-top: 27px;
}

.welcome p {
  font-size: 13px;
  opacity: .85;
}

.welcome h2 {
  font-family: 'Playfair Display', serif;
  font-size: 29px;
  margin-top: 4px;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 20px 16px 90px;
}

.pass-card {
  background: white;
  border-radius: 22px;
  padding: 20px;
  margin-top: -8px;
  box-shadow: 0 8px 25px rgba(24,70,68,.09);
}

.pass-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.pass-title {
  font-weight: 700;
  font-size: 18px;
}

.status {
  background: #dcfce7;
  color: #166534;
  padding: 6px 11px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 700;
}

.hotel-name {
  font-size: 14px;
  margin-top: 14px;
  color: #55706e;
}

.pass-number {
  margin-top: 15px;
  background: #f0fdfa;
  border-radius: 14px;
  padding: 13px;
  font-size: 12px;
  color: #0f766e;
}

.section-title {
  font-family: 'Playfair Display', serif;
  font-size: 21px;
  margin: 28px 4px 13px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 13px;
}

.feature {
  background: white;
  border: none;
  border-radius: 19px;
  padding: 19px 15px;
  text-align: left;
  min-height: 130px;
  box-shadow: 0 5px 18px rgba(24,70,68,.07);
  cursor: pointer;
  transition: transform .15s, box-shadow .15s;
}

.feature:active {
  transform: scale(.97);
}

.feature-icon {
  width: 43px;
  height: 43px;
  border-radius: 13px;
  background: #e6f5f3;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  margin-bottom: 12px;
}

.feature h3 {
  font-size: 15px;
  color: #173b3a;
}

.feature p {
  color: #718482;
  font-size: 11px;
  margin-top: 5px;
  line-height: 1.4;
}

.savings {
  background: linear-gradient(135deg, #164e63, #0f766e);
  color: white;
  border-radius: 23px;
  padding: 21px;
  margin-top: 25px;
  box-shadow: 0 10px 25px rgba(15,118,110,.18);
}

.savings-label {
  font-size: 12px;
  opacity: .85;
}

.savings h2 {
  font-size: 31px;
  margin: 4px 0;
}

.savings p {
  font-size: 12px;
  opacity: .85;
}

.rewards {
  background: white;
  border-radius: 22px;
  padding: 20px;
  margin-top: 16px;
  box-shadow: 0 5px 18px rgba(24,70,68,.07);
}

.reward-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.reward-header h3 {
  font-size: 16px;
}

.points {
  color: #0f766e;
  font-weight: 700;
}

.progress {
  height: 9px;
  background: #e7eeee;
  border-radius: 20px;
  margin: 15px 0 8px;
  overflow: hidden;
}

.progress-bar {
  width: 68%;
  height: 100%;
  background: linear-gradient(90deg,#0f766e,#14b8a6);
  border-radius: 20px;
}

.reward-small {
  font-size: 11px;
  color: #718482;
}

.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: rgba(255,255,255,.96);
  backdrop-filter: blur(10px);
  border-top: 1px solid #e1e9e7;
  height: 67px;
  display: flex;
  justify-content: space-around;
  align-items: center;
  z-index: 20;
}

.nav-item {
  border: none;
  background: transparent;
  color: #829391;
  font-size: 10px;
  cursor: pointer;
}

.nav-item.active {
  color: #0f766e;
  font-weight: 700;
}

.nav-icon {
  display: block;
  font-size: 20px;
  margin-bottom: 3px;
}

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.45);
  z-index: 50;
  align-items: flex-end;
  justify-content: center;
}

.modal-box {
  background: white;
  width: 100%;
  max-width: 700px;
  border-radius: 28px 28px 0 0;
  padding: 25px 20px 35px;
  animation: slideUp .25s ease;
}

@keyframes slideUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}

.modal-box h2 {
  font-family: 'Playfair Display', serif;
  margin-bottom: 10px;
}

.modal-box p {
  color: #667c79;
  line-height: 1.6;
  font-size: 14px;
}

.close {
  margin-top: 20px;
  width: 100%;
  padding: 13px;
  border: none;
  border-radius: 14px;
  background: #0f766e;
  color: white;
  font-weight: 700;
}

@media (min-width: 600px) {
  .grid {
    grid-template-columns: repeat(3, 1fr);
  }
}
</style>
</head>

<body>

<header class="header">
  <div class="logo">
    <div class="logo-icon">🏨</div>
    <div>
      <h1>Hotel Easy Pass</h1>
      <p>Your stay, simplified.</p>
    </div>
  </div>

  <div class="welcome">
    <p>WELCOME BACK</p>
    <h2>Make yourself at home.</h2>
  </div>
</header>

<main class="container">

  <section class="pass-card">
    <div class="pass-top">
      <div class="pass-title">My Hotel Pass</div>
      <div class="status">ACTIVE</div>
    </div>

    <div class="hotel-name">Your hotel information will appear here</div>

    <div class="pass-number">
      🎫 Pass ready • Easy access to your stay
    </div>
  </section>

  <h2 class="section-title">Explore Nearby</h2>

  <div class="grid">

    <button class="feature" onclick="openModal('Attractions')">
      <div class="feature-icon">📍</div>
      <h3>Nearby Attractions</h3>
      <p>Discover places to visit, explore and enjoy.</p>
    </button>

    <button class="feature" onclick="openModal('Cuisine')">
      <div class="feature-icon">🍽️</div>
      <h3>Nearby Cuisine</h3>
      <p>Find restaurants and food nearby.</p>
    </button>

    <button class="feature" onclick="openModal('Deals')">
      <div class="feature-icon">🏷️</div>
      <h3>Discounts & Savings</h3>
      <p>Keep track of deals and money-saving offers.</p>
    </button>

    <button class="feature" onclick="openModal('Rewards')">
      <div class="feature-icon">⭐</div>
      <h3>Hotel Rewards</h3>
      <p>Track your hotel points and rewards.</p>
    </button>

    <button class="feature" onclick="openModal('Hotel')">
      <div class="feature-icon">🛎️</div>
      <h3>Hotel Services</h3>
      <p>Quick access to useful hotel information.</p>
    </button>

    <button class="feature" onclick="openModal('Travel')
